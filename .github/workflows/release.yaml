name: Release and deploy

on:
  push:
    branches:
      - master

env:
  APP_NAME: z15a
  KUMA_APP: z15a

jobs:
  release:
    name: Create release commit and tag
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, 'chore(release)')"

    permissions:
      contents: write

    outputs:
      version: ${{ steps.output_version.outputs.version }}
      release_commit_sha: ${{ steps.output_version.outputs.release_commit_sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for standard-version to access tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install yarn and dependencies
        run: |
          npm i -g corepack
          corepack enable
          yarn install --immutable

      - name: Run tests and build
        run: |
          yarn test
          yarn lint
          yarn build

      - name: Bump version and generate changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          yarn release

      - name: Push release commit and tags
        uses: ad-m/github-push-action@master
        with:
          branch: master
          tags: true

      - name: Output new version and release commit sha
        id: output_version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_alpine:
    name: Build Alpine artifacts
    needs: release
    uses: ./.github/workflows/build-alpine.yaml
    with:
      ref: ${{ needs.release.outputs.release_commit_sha }}
    permissions:
      contents: read
    
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build_alpine
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_alpine.outputs.artifact-name }}

      - name: Deploy frontend
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "packages/frontend/dist/*"
          target: "/apps/${{ env.APP_NAME }}/frontend"
          strip_components: 3

      - name: Stop backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: docker stop ${{ env.APP_NAME }}_backend || '${{ env.APP_NAME }}_backend does not exist'

      - name: Deploy backend
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "packages/backend/dist/*"
          target: "/apps/${{ env.APP_NAME }}/backend"
          strip_components: 3
          rm: true

      - name: Deploy docker configs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "docker,docker-compose.yml"
          target: "/apps/${{ env.APP_NAME }}"

      - name: Restart Docker containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            touch /apps/data/${{ env.APP_NAME }}_db/db.db
            cd /apps/${{ env.APP_NAME }}
            docker compose stop backend
            docker compose up -d
